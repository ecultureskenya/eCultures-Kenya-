<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Alal AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #f8f9fa; transition: 0.3s; }
    #chatContainer { max-width: 600px; margin: 40px auto; }
    #messages {
      height: 450px;
      overflow-y: auto;
      background: white;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 10px;
    }

    .message { margin-bottom: 16px; }
    .user .text {
      background: #d1e7dd;
      color: #0f5132;
      padding: 12px 16px;
      border-radius: 10px;
      display: inline-block;
    }
    .bot .text {
      background: #e2e3e5;
      color: #41464b;
      padding: 12px 16px;
      border-radius: 10px;
      display: inline-block;
    }

    /* Dark Mode */
    .dark-mode {
      background: #1e1e1e;
      color: #eee;
    }
    .dark-mode #messages {
      background: #2c2c2c;
      border-color: #444;
    }
    .dark-mode .user .text {
      background: #0f5132;
      color: #fff;
    }
    .dark-mode .bot .text {
      background: #3c3c3c;
      color: #fff;
    }

    /* Typing dots */
    .typing {
      display: inline-block;
      padding: 12px 16px;
      background: #e2e3e5;
      border-radius: 10px;
      color: #444;
    }
    .dot {
      height: 6px;
      width: 6px;
      background: #6c757d;
      border-radius: 50%;
      display: inline-block;
      margin: 0 2px;
      animation: blink 1.4s infinite both;
    }
    @keyframes blink {
      0% { opacity: 0.2; }
      20% { opacity: 1; }
      100% { opacity: 0.2; }
    }
  </style>
</head>

<body>
  <div id="chatContainer" class="card shadow-sm">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="card-title mb-0">Alal AI</h5>
        <button id="toggleTheme" class="btn btn-sm btn-outline-secondary">Dark Mode</button>
      </div>

      <div id="messages"></div>

      <form id="chatForm" class="mt-3">
        <div class="input-group">
          <input id="userInput" type="text" class="form-control" placeholder="Type your message…" required autocomplete="off">
          <button class="btn btn-primary" type="submit">Send</button>
        </div>
      </form>

    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const toggleBtn = document.getElementById('toggleTheme');

    let dark = false;

    // Theme Toggle
    toggleBtn.addEventListener('click', () => {
      dark = !dark;
      document.body.classList.toggle('dark-mode', dark);
      toggleBtn.textContent = dark ? 'Light Mode' : 'Dark Mode';
    });

    // Append message
    function appendMessage(sender, text) {
      const div = document.createElement('div');
      div.classList.add('message', sender);

      const span = document.createElement('span');
      span.classList.add('text');
      span.textContent = text;

      div.appendChild(span);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Typing animation
    function showTyping() {
      const div = document.createElement('div');
      div.classList.add('message', 'bot', 'typing-indicator');
      div.innerHTML = `<span class="typing">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </span>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    // REAL AI RESPONSE (OpenAI API)
    async function getAIResponse(prompt) {

      const API_KEY = "AIzaSyCnz5ZFCluw4U0eXWP_LA9pCgM3LYsbtiE";  // ← Put your key here

      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: "gpt-4.1-mini",
          messages: [
            { role: "system", content: "You are Alal AI — smart, friendly, logical and helpful." },
            { role: "user", content: prompt }
          ]
        })
      });

      const data = await response.json();
      return data.choices[0].message.content;
    }

    // Handle Chat Send
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      userInput.value = '';

      // Show typing animation
      const typingDiv = showTyping();

      // Fetch from OpenAI
      try {
        const reply = await getAIResponse(text);
        messagesEl.removeChild(typingDiv);
        appendMessage('bot', reply);
      } catch (err) {
        messagesEl.removeChild(typingDiv);
        appendMessage('bot', "⚠️ Error: Could not reach AI server.");
      }
    });
  </script>

</body>
</html>
