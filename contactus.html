<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eCultures | Contact Us</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* ---------- General Layout ---------- */
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: "Times New Roman", Times, serif;
      color: #fff;
      overflow-x: hidden;
      position: relative;
    }

    main {
      flex: 1;
    }

    /* ---------- Background ---------- */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -2;
      background: linear-gradient(120deg, #8B4513, #D4A017, #8B4513);
      background-size: 200% 200%;
      animation: gradientShift 10s ease infinite;
      opacity: 0.9;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ---------- Navbar ---------- */
    .navbar {
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      transition: background 0.6s ease;
    }

    .navbar-brand, .nav-link {
      color: #fff !important;
      transition: color 0.6s ease;
    }

    .nav-link:hover {
      color: #FFD700 !important;
      text-shadow: 0 0 8px #FFD700;
    }

    /* ---------- Form ---------- */
    form {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
      transition: all 0.6s ease-in-out;
      animation: fadeIn 1.5s ease-in-out;
    }

    form:hover {
      transform: translateY(-6px) scale(1.02);
      background-color: rgba(0, 0, 0, 0.8);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
    }

    input, textarea {
      background-color: rgba(255, 255, 255, 0.2) !important;
      color: #fff !important;
      border: none;
      border-radius: 8px;
      transition: all 0.6s ease;
    }

    input:focus, textarea:focus {
      background-color: rgba(255, 255, 255, 0.25) !important;
      box-shadow: 0 0 10px #FFD700;
    }

    input::placeholder, textarea::placeholder {
      color: #ddd !important;
      transition: color 0.6s ease;
    }

    /* ---------- Button ---------- */
    .btn-gold {
      background-color: #D4A017;
      border: none;
      color: #000;
      font-weight: bold;
      transition: all 0.6s ease;
    }

    .btn-gold:hover {
      background-color: #FFD700;
      transform: scale(1.08);
      box-shadow: 0 0 20px #FFD700;
    }

    /* ---------- Header Text ---------- */
    h2 {
      text-align: center;
      margin-bottom: 25px;
      text-shadow: 0 0 15px rgba(212, 160, 23, 0.8);
      animation: fadeInUp 1.8s ease-in-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ---------- Footer ---------- */
    footer {
      background-color: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 15px 0;
      text-align: center;
      backdrop-filter: blur(6px);
      margin-top: auto;
      transition: all 0.6s ease;
    }

    footer:hover {
      background-color: rgba(0, 0, 0, 0.9);
      text-shadow: 0 0 5px #FFD700;
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">eCultures</a>
    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="cultures.html">Cultures</a></li>
        <li class="nav-item"><a class="nav-link" href="Cultural Events.html">Cultural Events</a></li>
        <li class="nav-item"><a class="nav-link" href="ourservices.html">Our Services</a></li>
        <li class="nav-item"><a class="nav-link" href="aboutus.html">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="contactus.html">Contact Us</a></li>
        <li class="nav-item"><a class="nav-link" href="faqs.html">FAQs</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main Content -->
<main class="container py-5">
  <h2>Contact Us</h2>
  <form class="mx-auto" style="max-width: 600px;">
    <div class="mb-3">
      <label for="name" class="form-label text-light">Full Name</label>
      <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label text-light">Email Address</label>
      <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
    </div>
    <div class="mb-3">
      <label for="message" class="form-label text-light">Message</label>
      <textarea class="form-control" id="message" rows="4" placeholder="Type your message..." required></textarea>
    </div>
    <button type="submit" class="btn btn-gold w-100">Send Message</button>
  </form>
</main>

<!-- Footer -->
<footer>
  <p>© 2025 eCultures Kenya | Knowledge Through Heritage</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
